name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            html-guide/package-lock.json
      - name: Install extension dependencies
        run: npm ci
      - name: Test extension
        run: npm test
      - name: Install guide dependencies
        run: npm ci --prefix html-guide
      - name: Test rendered guide
        run: npm test --prefix html-guide
